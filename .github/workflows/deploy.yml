name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages has required actions:read since v4
  actions: read

# Allow one deploy at a time; never cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Verify deploy artifacts
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/.nojekyll
          grep -q 'dirt.incantationjunction.com' dist/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # v4+ excludes dotfiles by default, which would silently drop
          # .nojekyll from the artifact
          include-hidden-files: true

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
