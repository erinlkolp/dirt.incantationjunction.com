name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check, build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The field report's numbers, test names and code listing are claims
      # about another repository, and nothing here can notice when it moves.
      # Tracks its default branch deliberately: a constant changed over there
      # turns this build red, which is the point. CI only -- Deploy does not
      # run this, so drift never blocks publishing the site.
      - name: Check out the scripts the field report describes
        uses: actions/checkout@v7
        with:
          repository: erinlkolp/computercraft-scripts
          path: .external/computercraft-scripts
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Astro check (types and templates)
        run: npm run check

      - name: Field report still matches the real source
        run: npm run check:drift -- .external/computercraft-scripts

      - name: Build
        run: npm run build

      - name: Assert required output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/.nojekyll
          grep -q 'dirt.incantationjunction.com' dist/CNAME
          grep -q 'All rights reserved' dist/index.html
          grep -q "$(date -u +%Y) SipsCo" dist/index.html
          # the mark must keep its TM; guard against it being dropped or
          # silently promoted to (R), which would be unlawful unregistered
          grep -q 'Big Money, Big Women, Big Fun&trade;' dist/index.html
          ! grep -q 'Big Fun&reg;' dist/index.html
          # photography must survive the build; these are referenced by the pages
          test -f dist/img/another-happy-customer.webp
          test -f dist/img/sjin-factory-tour.webp
          test -f dist/img/mining-turtle.webp
          test -f dist/img/rnd-facility.webp
          test -f dist/img/rnd-facility-fitout.webp
          test -f dist/img/rnd-facility-floor.webp
          test -f dist/img/rnd-lounge.webp
          test -f dist/img/rnd-beta-units.webp
          # every page past the homepage is its own route, so a build that
          # silently drops one would still pass every assertion above
          test -f dist/rnd/index.html
          test -f dist/rnd/unit-7/index.html
          test -f dist/news/index.html
          # the newsroom is split: the homepage teaser must link to the
          # archive, and the archive must carry entries the teaser does not
          grep -q 'href="/news/"' dist/index.html
          grep -q 'Coarse Blend No. 7' dist/news/index.html
          ! grep -q 'Coarse Blend No. 7' dist/index.html

      # --offline needs --root-dir or every root-relative href fails to resolve.
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --root-dir "${{ github.workspace }}/dist"
            --exclude '^mailto:'
            --no-progress
            "dist/**/*.html"
          fail: true
